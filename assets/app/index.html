<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rdf-compare viewer</title>
    <link rel="stylesheet" href="/assets/vendor/tabulator/tabulator.min.css" />
    <link rel="stylesheet" href="/assets/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/assets/app/styles.css" />
  </head>
  <body>
    <header>
      <h1>rdf-compare <span id="version" class="version"></span></h1>
      <div id="meta" class="meta"></div>
      <div class="controls">
        <label class="legend"><span id="legend-added" class="badge added" title="Triple present in B but not in A">+ Added</span></label>
        <label class="legend"><span id="legend-deleted" class="badge deleted" title="Triple present in A but not in B">− Deleted</span></label>
        <label class="legend"><span id="legend-changed" class="badge changed" title="Same subject and predicate with a new value in B">~ Changed</span></label>
        <label class="legend triple-view-label">
          <span>Triples to show:</span>
          <select id="triple-view">
            <option value="only-diff" selected>Only diff</option>
            <option value="diff-and-common">Diff + common</option>
            <option value="only-common">Only common</option>
            <option value="only-added">Only added</option>
            <option value="only-removed">Only removed</option>
            <option value="only-changed">Only changed</option>
          </select>
          <span id="common-error" class="error-msg hidden"></span>
        </label>
        <label class="legend check-label" title="Show a removed and an added triple with the same subject and predicate as one changed row">
          <input id="group-changes" type="checkbox" checked /> Group changes
        </label>
        <button id="toggle-summary" class="ghost hidden" aria-expanded="true">Summary</button>
        <button id="open-load" class="ghost">Load files…</button>
      </div>
    </header>
    <main>
      <div id="empty-state" class="empty hidden">
        <p>No diff loaded. Use <code>--file-a</code>/<code>--file-b</code> on the CLI, the loader below, or a URL such as <code>/?a=old.ttl&amp;b=new.ttl</code>.</p>
      </div>
      <div id="loader" class="loader hidden">
        <h2>Load RDF files</h2>
        <label>File A path <input id="path-a" type="text" list="rdf-files" placeholder="/path/to/a.ttl" /></label>
        <label>File B path <input id="path-b" type="text" list="rdf-files" placeholder="/path/to/b.ttl" /></label>
        <label>Or diff file <input id="path-diff" type="text" list="rdf-files" placeholder="/path/to/diff.trig" /></label>
        <datalist id="rdf-files"></datalist>
        <div>
          <label class="inline" title="Compare numbers, booleans, date/times, language tags and WKT by their canonical form"><input id="opt-normalize" type="checkbox" /> Normalise literals</label>
          <label class="inline" title="Round WKT coordinates to this many decimals before comparing">WKT precision <input id="opt-wkt-precision" class="narrow" type="number" min="0" max="15" placeholder="off" /></label>
        </div>
        <button id="do-load">Load</button>
        <div id="loader-msg"></div>
      </div>
      <section id="summary" class="summary hidden" aria-label="Diff summary">
        <div id="summary-cards" class="summary-cards"></div>
        <div class="summary-grid">
          <div class="summary-block">
            <h3>Predicates <span class="hint">click to filter</span></h3>
            <div class="summary-scroll"><table id="summary-predicates"></table></div>
          </div>
          <div class="summary-block">
            <h3>Classes <span class="hint">rdf:type of affected subjects · click to filter</span></h3>
            <div class="summary-scroll"><table id="summary-classes"></table></div>
          </div>
          <div class="summary-block">
            <h3>Most changed subjects <span class="hint">click to filter</span></h3>
            <div class="summary-scroll"><table id="summary-subjects"></table></div>
          </div>
        </div>
      </section>
      <div id="table" class="table"></div>
      <div id="loading-overlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p id="loading-msg">Loading rows…</p>
      </div>
      <div id="map" class="map hidden"></div>
    </main>
    <script src="/assets/vendor/tabulator/tabulator.min.js"></script>
    <script src="/assets/vendor/leaflet/leaflet.js"></script>
    <script src="/assets/vendor/wellknown/wellknown.js"></script>
    <script src="/assets/app/map.js"></script>
    <script src="/assets/app/app.js"></script>
  </body>
</html>
